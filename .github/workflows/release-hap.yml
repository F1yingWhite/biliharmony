name: Build release HAP

# 每次 push 到 main（或手动触发）：GitHub 官方 ubuntu 机器构建未签名 release HAP，
# 全量 QA 通过后保留 CI artifact；只有新 versionName 才发布不可变版本 Release。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

concurrency:
  group: release-hap-${{ github.ref }}
  # 发布/上传期间不中断前一个 main run，避免产生半成品版本。
  cancel-in-progress: false

jobs:
  build-release-hap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # 上一个已发布编号版本是本版更新日志的历史边界。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # hvigor 的纹理压缩工具链在 Linux 上需要 mesa GL。
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev clang g++ mpv ffmpeg

      # 下载 HarmonyOS command-line-tools + API 26 SDK（与 compileSdkVersion 26.0.0 对应），
      # 设置 HOS_SDK_HOME 并把 hvigorw/ohpm 加入 PATH。
      - name: Set up HarmonyOS command-line tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: '26.0.0.821'
          cache: true

      - name: Locate toolchain
        run: |
          set -euo pipefail
          echo "HOS_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          CTL_ROOT="$(dirname "$HOS_SDK_HOME")"
          echo "CTL_ROOT=$CTL_ROOT" >> "$GITHUB_ENV"
          echo "$CTL_ROOT/bin" >> "$GITHUB_PATH"
          hvigorw_path="$(find "$CTL_ROOT" -name hvigorw -type f | head -1)"
          echo "hvigorw: ${hvigorw_path:-MISSING}"
          # QA 沙箱的 TypeScript 转译器优先用工具链自带的一份；没有就临时装一份。
          ts_dir="$(find "$CTL_ROOT" -type d -path '*hvigor/node_modules/typescript' | head -1)"
          if [ -z "$ts_dir" ]; then
            npm i --prefix "$RUNNER_TEMP/ts" typescript@5.8 --no-audit --no-fund
            ts_dir="$RUNNER_TEMP/ts/node_modules/typescript"
          fi
          echo "ARKTS_TEST_TYPESCRIPT=$ts_dir" >> "$GITHUB_ENV"
          java -version 2>&1 | head -1
          node --version

      - name: Install dependencies
        run: ohpm install --all

      - name: Prepare required native HDR regression headers
        run: |
          set -euo pipefail
          python3 tool/qa/prepare-hdr-test-deps.py \
            --sdk-root "$HOS_SDK_HOME" \
            --work-dir "$RUNNER_TEMP/mpv-hdr-deps" \
            --github-env "$GITHUB_ENV"

      # 仓库内 build-profile 的 signingConfigs 为空数组（签名材料不入库），
      # 摘除 product 对默认签名配置的悬空引用，hvigor 才会产出未签名 HAP 而非报错。
      - name: Neutralize dangling signing reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('build-profile.json5')
          text = p.read_text()
          if re.search(r'"signingConfigs"\s*:\s*\[\s*\]', text):
              stripped = re.sub(r'"signingConfig"\s*:\s*"default"\s*,?', '', text)
              if stripped != text:
                  p.write_text(stripped)
                  print('removed dangling signingConfig reference')
              else:
                  print('no dangling signingConfig reference found')
          else:
              print('signing configs present, leaving profile untouched')
          PY

      - name: Run service regression tests
        run: |
          # Bash 展开仓库的所有测试文件；无须依赖 Node 对 glob 的版本差异。
          node --test --test-timeout=20000 tool/qa/*.test.cjs

      - name: Test UI selectors and navigation assertions without a device
        run: |
          python3 tool/qa/player_layout_test.py
          python3 tool/qa/suite_deep_test.py

      - name: Build unsigned release HAP
        run: hvigorw clean assembleHap --mode module -p product=default -p buildMode=release

      - name: Verify release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          generated_profile="entry/build/default/generated/profile/default/BuildProfile.ets"
          grep -Fq "BUILD_MODE_NAME = 'release'" "$generated_profile"
          grep -Fq "DEBUG = false" "$generated_profile"
          hap="entry/build/default/outputs/default/entry-default-unsigned.hap"
          test -f "$hap"
          python3 tool/qa/player-mpv-package-check.py "$hap"
          node tool/publish-release.cjs --prepare-artifact
          ( cd entry/build/default/outputs/default/publish && sha256sum --check hap.sha256 )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: biliharmony-${{ steps.artifacts.outputs.tag }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            entry/build/default/outputs/default/publish/*.hap
            entry/build/default/outputs/default/publish/hap.sha256
          if-no-files-found: error
          retention-days: 30

      # 新版本只创建一次；同版本后续提交仍可在本次 Actions artifact 下载。
      - name: Publish immutable version release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tool/publish-release.cjs
