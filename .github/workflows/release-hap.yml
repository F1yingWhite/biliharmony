name: Build release HAP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-hap:
    # HarmonyOS API 26 / DevEco Studio is not installed on GitHub-hosted runners.
    # Register a macOS ARM64 self-hosted runner with the custom label "biliharmony".
    runs-on: [self-hosted, macOS, ARM64, biliharmony]
    timeout-minutes: 30
    env:
      HARMONY_BUILD_PROFILE_B64: ${{ secrets.HARMONY_BUILD_PROFILE_B64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check DevEco toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw
          test -x /Applications/DevEco-Studio.app/Contents/tools/ohpm/bin/ohpm
          test -d /Applications/DevEco-Studio.app/Contents/sdk/default

      - name: Apply private signing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HARMONY_BUILD_PROFILE_B64}" ]; then
            printf '%s' "${HARMONY_BUILD_PROFILE_B64}" | /usr/bin/base64 -D > build-profile.json5
            echo "Signing configuration loaded from GitHub Actions secrets."
          else
            echo "No signing secret configured; the unsigned release HAP will still be uploaded."
          fi
          # 旧签名 Secret 可能保留 API 24；仅统一 SDK 元数据，保留全部签名字段。
          python3 - <<'PY'
          from pathlib import Path
          import re
          profile = Path('build-profile.json5')
          updated, count = re.subn(r'("compatibleSdkVersion"\s*:\s*)("[^"]*"|\d+)',
                                   r'\1"26.0.0"', profile.read_text())
          if count == 0:
              raise SystemExit('compatibleSdkVersion is missing from build-profile.json5')
          profile.write_text(updated)
          PY

      - name: Run service regression tests
        shell: bash
        run: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node --test --test-timeout=10000 tool/qa/regression.test.cjs tool/qa/lifecycle.test.cjs tool/qa/danmaku.test.cjs tool/qa/parity.test.cjs

      - name: Build release HAP
        shell: bash
        run: bash tool/build.sh clean release

      - name: Verify and checksum release artifacts
        shell: bash
        run: |
          set -euo pipefail
          generated_profile="entry/build/default/generated/profile/default/BuildProfile.ets"
          output_dir="entry/build/default/outputs/default"

          grep -Fq "BUILD_MODE_NAME = 'release'" "${generated_profile}"
          grep -Fq "DEBUG = false" "${generated_profile}"

          shopt -s nullglob
          packages=("${output_dir}"/*.hap)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No release HAP was generated."
            exit 1
          fi

          for package in "${packages[@]}"; do
            shasum -a 256 "${package}" > "${package}.sha256"
          done

      - name: Upload release HAP
        uses: actions/upload-artifact@v7
        with:
          name: biliharmony-release-${{ github.run_number }}-${{ github.sha }}
          path: |
            entry/build/default/outputs/default/*.hap
            entry/build/default/outputs/default/*.hap.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove private signing configuration
        if: always()
        shell: bash
        run: git restore --source=HEAD --worktree build-profile.json5
