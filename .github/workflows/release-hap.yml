name: Build release HAP

# 每次 push 到 main（或手动触发）：GitHub 官方 ubuntu 机器构建未签名 release HAP，
# 全量 QA 通过后发布到滚动 Release（tag=latest，每次刷新覆盖）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

concurrency:
  group: release-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-hap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # 需要完整历史与 latest 标签：生成「上次构建 → 本次」的更新日志。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # hvigor 的纹理压缩工具链在 Linux 上需要 mesa GL。
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      # 下载 HarmonyOS command-line-tools + API 26 SDK（与 compileSdkVersion 26.0.0 对应），
      # 设置 HOS_SDK_HOME 并把 hvigorw/ohpm 加入 PATH。
      - name: Set up HarmonyOS command-line tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: '26.0.0.821'
          cache: true

      - name: Locate toolchain
        run: |
          set -euo pipefail
          echo "HOS_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          CTL_ROOT="$(dirname "$HOS_SDK_HOME")"
          echo "CTL_ROOT=$CTL_ROOT" >> "$GITHUB_ENV"
          echo "$CTL_ROOT/bin" >> "$GITHUB_PATH"
          hvigorw_path="$(find "$CTL_ROOT" -name hvigorw -type f | head -1)"
          echo "hvigorw: ${hvigorw_path:-MISSING}"
          # QA 沙箱的 TypeScript 转译器优先用工具链自带的一份；没有就临时装一份。
          ts_dir="$(find "$CTL_ROOT" -type d -path '*hvigor/node_modules/typescript' | head -1)"
          if [ -z "$ts_dir" ]; then
            npm i --prefix "$RUNNER_TEMP/ts" typescript@5.8 --no-audit --no-fund
            ts_dir="$RUNNER_TEMP/ts/node_modules/typescript"
          fi
          echo "ARKTS_TEST_TYPESCRIPT=$ts_dir" >> "$GITHUB_ENV"
          java -version 2>&1 | head -1
          node --version

      - name: Install dependencies
        run: ohpm install --all

      # 仓库内 build-profile 的 signingConfigs 为空数组（签名材料不入库），
      # 摘除 product 对默认签名配置的悬空引用，hvigor 才会产出未签名 HAP 而非报错。
      - name: Neutralize dangling signing reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('build-profile.json5')
          text = p.read_text()
          if re.search(r'"signingConfigs"\s*:\s*\[\s*\]', text):
              stripped = re.sub(r'"signingConfig"\s*:\s*"default"\s*,?', '', text)
              if stripped != text:
                  p.write_text(stripped)
                  print('removed dangling signingConfig reference')
              else:
                  print('no dangling signingConfig reference found')
          else:
              print('signing configs present, leaving profile untouched')
          PY

      - name: Run service regression tests
        run: |
          node --test --test-timeout=10000 \
            tool/qa/danmaku.test.cjs tool/qa/dock-transition.test.cjs tool/qa/handedness.test.cjs \
            tool/qa/lifecycle.test.cjs tool/qa/parity.test.cjs tool/qa/player-seek.test.cjs \
            tool/qa/regression.test.cjs

      - name: Build unsigned release HAP
        run: hvigorw clean assembleHap --mode module -p product=default -p buildMode=release

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          generated_profile="entry/build/default/generated/profile/default/BuildProfile.ets"
          grep -Fq "BUILD_MODE_NAME = 'release'" "$generated_profile"
          grep -Fq "DEBUG = false" "$generated_profile"
          hap="entry/build/default/outputs/default/entry-default-unsigned.hap"
          test -f "$hap"
          ( cd entry/build/default/outputs/default && sha256sum -- *.hap > hap.sha256 )
          cat "$OUT_DIR/hap.sha256"
        env:
          OUT_DIR: entry/build/default/outputs/default

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: biliharmony-release-${{ github.run_number }}-${{ github.sha }}
          path: |
            entry/build/default/outputs/default/*.hap
            entry/build/default/outputs/default/hap.sha256
          if-no-files-found: error
          retention-days: 30

      # 滚动 Release：tag=latest，每次推送刷新（删除重建）；未签名 HAP 需自行签名后安装。
      - name: Generate standardized release notes
        run: |
          set -euo pipefail
          # PREV：latest 标签指向的上一次构建提交；首次发布时为空（脚本只取最近 20 条）。
          prev="$(git rev-parse -q --verify refs/tags/latest 2>/dev/null || true)"
          bash tool/release-notes.sh "$prev" "$GITHUB_SHA" > release_notes.md
          echo "---- release notes ----"
          cat release_notes.md

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=entry/build/default/outputs/default
          TITLE="最新构建（未签名 HAP）"
          # latest 标签随本次构建移动（给下一次发布划更新范围的边界）。
          if git rev-parse -q --verify refs/tags/latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --prerelease --notes-file release_notes.md
            gh release upload latest --clobber "$OUT/entry-default-unsigned.hap" "$OUT/hap.sha256"
          else
            gh release create latest --target "$GITHUB_SHA" \
              --title "$TITLE" --prerelease --notes-file release_notes.md \
              "$OUT/entry-default-unsigned.hap" "$OUT/hap.sha256"
          fi
